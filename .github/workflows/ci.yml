name: CI

# Runs the test suite and a production build on every push/PR — the gate
# that was previously missing entirely for this app (the backend and
# customer storefront each already have one; this admin panel didn't).
# Nothing here talks to a live backend — every API call in the test suite
# is mocked at the apiClient module boundary, and `react-scripts build`
# only needs the source tree.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx react-scripts test --watchAll=false

      - name: Build
        # `npm run build` (not a bare `npx react-scripts build`) so the
        # `prebuild` lifecycle hook — scripts/check-prod-env.js, which
        # refuses a build with no real REACT_APP_API_URL — actually runs
        # here. A bare react-scripts invocation skips npm's pre/post hooks
        # entirely, which is exactly how this guard went unexercised by CI
        # despite being correctly implemented (see check-prod-env.js).
        # REACT_APP_API_URL below is a CI-only placeholder (the reserved
        # .invalid TLD, RFC 2606 — guaranteed never to resolve): this step
        # only proves the build itself succeeds and the guard still runs; a
        # real deploy needs its own real REACT_APP_API_URL set via its
        # platform's environment variables, same as always.
        run: npm run build
        env:
          REACT_APP_API_URL: https://ci-placeholder.invalid
